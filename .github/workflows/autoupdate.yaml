name: Update dependencies

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

jobs:
  update:
    # Upstream's dependency updates (Renovate through upstream's shared workflow, which then triggers upstream's
    # release workflow). A fork has neither the tokens nor the release pipeline, so this runs only in upstream's own
    # repository and is skipped everywhere else.
    if: github.repository == 'lukaszraczylo/claude-mnemonic'
    uses: lukaszraczylo/shared-actions/.github/workflows/renovate-autoupdate.yaml@main
    with:
      go-version: ">=1.24"
      node-working-directory: ui
      require-node-tests: false
      release-workflow: release.yaml
